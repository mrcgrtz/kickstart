# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
    # Maintain dependencies for Node
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'monthly'
          time: '05:00'
          timezone: 'Europe/Berlin'
      open-pull-requests-limit: 10
      assignees:
          - 'mrcgrtz'
      labels:
          - 'dependencies'
          - 'javascript'
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      cooldown:
          default-days: 5
          semver-major-days: 14
      groups:
          # Families that must move in lockstep, majors included.
          cssnano:
              patterns:
                  - 'cssnano*'
          postcss:
              patterns:
                  - 'postcss'
                  - 'postcss-*'
                  - '@csstools/*'
          stylelint:
              patterns:
                  - 'stylelint'
                  - 'stylelint-*'
          # Everything else, majors excluded so auto-merge keeps working.
          js-production:
              dependency-type: 'production'
              update-types:
                  - 'minor'
                  - 'patch'
          js-development:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'

    # Check for updates to GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'
          time: '06:00'
          timezone: 'Europe/Berlin'
      assignees:
          - 'mrcgrtz'
      labels:
          - 'dependencies'
          - 'github_actions'
      commit-message:
          prefix: 'chore(deps)'
      cooldown:
          default-days: 5
      groups:
          github-actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
